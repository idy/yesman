<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yesman</title>
  <link rel="stylesheet" href="/mds/css/magpie.css">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="titlebar drag" id="titlebar">
      <div class="mds-brand titlebar-brand">
        <span class="mds-brand-mark" aria-hidden="true"></span>
        <span class="mds-brand-name">yesman</span>
      </div>
      <div class="mds-titlebar-content titlebar-content">
        <nav class="mds-crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="mds-titlebar-actions mds-titlebar-actions--balanced" id="bar-actions"></div>
      </div>
    </header>
    <aside class="side" id="side" aria-label="Yesmen">
      <nav class="side-list" id="yesmen"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <main class="main">
      <div class="body" id="body"></div>
    </main>
    <aside class="info" id="info" hidden></aside>
  </div>

  <dialog class="mds-dialog" id="hire-dialog">
    <form method="dialog" id="hire-form">
      <h2 class="mds-heading">Hire a yesman</h2>
      <p class="dialog-hint">A yesman gets a workspace of its own and a lead you talk to. Name it after the project or the job.</p>
      <label class="field">
        <span>Name</span>
        <input class="mds-input" name="name" required autocomplete="off" spellcheck="false"
               pattern="[a-z0-9][a-z0-9\-]{0,31}" placeholder="checkout-v2">
      </label>
      <p class="dialog-hint">Lowercase letters, digits and dashes.</p>
      <div class="mds-dialog-actions">
        <button class="mds-button" value="cancel" formnovalidate>Cancel</button>
        <button class="mds-button mds-button--primary" value="hire">Hire</button>
      </div>
    </form>
  </dialog>

  <dialog class="mds-dialog" id="confirm-dialog">
    <form method="dialog">
      <h2 class="mds-heading" id="confirm-title"></h2>
      <p class="dialog-hint" id="confirm-body"></p>
      <div class="mds-dialog-actions">
        <button class="mds-button" value="cancel">Cancel</button>
        <button class="mds-button mds-button--primary" value="ok" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
