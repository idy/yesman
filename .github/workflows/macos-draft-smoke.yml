# Review-only sample. Place at the existing path only on the approved temporary QA ref.
name: macOS draft startup
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Fixed draft tag from the adopted QA contract
        type: string
        required: true
      episode:
        description: Exact reviewed scenario selector
        type: string
        required: true
permissions: {}

jobs:
  download:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # Unpublished draft assets require this scope. All requests here are GETs.
    outputs:
      source: ${{ steps.lock.outputs.source }}
    steps:
      - name: Download only the reviewed contract data and its two numeric assets
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ inputs.release_tag }}
          EPISODE: ${{ inputs.episode }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          e = os.environ
          assert e['GITHUB_REPOSITORY'] == 'idy/yesman' and e['GITHUB_REF'] == 'refs/heads/qa/t322-v0.1.64-cleanup'
          assert e['GITHUB_RUN_ATTEMPT'] == '1' and e['EPISODE'] == 'cleanup-only'
          qa = e['GITHUB_SHA']
          tag = e['EXPECTED_TAG']
          assert re.fullmatch(r'[0-9a-f]{40}', qa) and tag == 'v0.1.64'
          def get(path, raw=False):
              args = ['gh','api','--method','GET','repos/idy/yesman/'+path]
              if raw:
                  args.extend(['-H','Accept: application/octet-stream' if path.startswith('releases/') else 'Accept: application/vnd.github.raw+json'])
              data = subprocess.check_output(args, timeout=90, stderr=subprocess.PIPE)
              return data if raw else json.loads(data)
          contract_bytes = get(f'contents/qa/t304/contract.json?ref={qa}', True)
          c = json.loads(contract_bytes)
          assert c['schema'] == 3
          assert (c['mode'],c['repository'],c['tag'],c['arch'],c['episode'],c['qaBase']) == (
              'candidate','idy/yesman',tag,'arm64',e['EPISODE'],'acea9a4018e2530db9af63a5aead8705ba1fe266')
          assert (c['releaseID'],c['assetID'],c['manifestID']) == (455729493,783812678,783812889)
          assert c['source'] == '68811d382ad5eac649d429630c21332c53f5cb59'
          assert all(type(c[k]) is int and c[k] > 0 for k in ('releaseID','assetID','manifestID','archiveBytes'))
          def source():
              obj = get('git/ref/tags/'+tag)['object']
              for _ in range(8):
                  assert re.fullmatch(r'[0-9a-f]{40}',obj['sha'])
                  if obj['type']=='commit': return obj['sha']
                  assert obj['type']=='tag'
                  obj = get('git/tags/'+obj['sha'])['object']
              raise AssertionError('Tag chain exceeded bound')
          assert source()==c['source']
          assert get('git/commits/'+c['source'])['tree']['sha']==c['tree']
          release=get(f'releases/{c["releaseID"]}')
          assert release['id']==c['releaseID'] and release['draft'] is True and release['tag_name']==tag
          folder=pathlib.Path(e['RUNNER_TEMP'])/'input'
          folder.mkdir()
          name = f'yesman-{tag[1:]}-darwin-arm64.tar.gz'
          for asset_id, filename, key in [(c['assetID'],name,'archiveSHA256'),(c['manifestID'],'update-darwin-arm64.json','manifestSHA256')]:
              row, = [row for row in release['assets'] if row['id']==asset_id and row['name']==filename]
              data = get(f'releases/assets/{asset_id}', True)
              assert len(data)==row['size'] and 'sha256:'+hashlib.sha256(data).hexdigest()==row['digest']=='sha256:'+c[key]
              (folder/filename).write_bytes(data)
              if asset_id==c['assetID']:
                  assert len(data)==c['archiveBytes']
                  asset = {k:row[k] for k in ('id','name','size','digest')}
          assert source()==c['source']
          (folder/'receipt.json').write_text(json.dumps(dict(tag=tag,arch='arm64',source=c['source'],releaseID=c['releaseID'],
              manifestID=c['manifestID'],asset=asset,sha256=c['archiveSHA256'],draft=True,qaHead=qa,
              contractSHA256=hashlib.sha256(contract_bytes).hexdigest(),runID=e['GITHUB_RUN_ID'],runAttempt=e['GITHUB_RUN_ATTEMPT'],
              episode=e['EPISODE'],qaRef=e['GITHUB_REF'])))
          with open(e['GITHUB_OUTPUT'],'a') as out: out.write('source='+c['source']+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-t322-draft-download
          path: ${{ runner.temp }}/input
          if-no-files-found: error

  acceptance:
    if: ${{ github.run_attempt == 1 }}
    needs: download
    runs-on: macos-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: qa-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.download.outputs.source }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: release-source/go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-t322-draft-download
          path: ${{ runner.temp }}/input
      - name: Exercise only the full cleanup scenario via production WebKit and Go
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EPISODE: ${{ inputs.episode }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/qa/t322-v0.1.64-cleanup
          test "$RELEASE_TAG" = v0.1.64
          test "$EPISODE" = cleanup-only
          kit="$GITHUB_WORKSPACE/qa-source/qa/t304"
          source="$GITHUB_WORKSPACE/release-source"
          input="$RUNNER_TEMP/input"
          test "$(git -C "$GITHUB_WORKSPACE/qa-source" rev-parse HEAD)" = "$GITHUB_SHA"
          qa_parents=$(git -C "$GITHUB_WORKSPACE/qa-source" cat-file commit HEAD | awk '/^$/{body=1} !body && /^parent /{print $2}')
          test "$qa_parents" = acea9a4018e2530db9af63a5aead8705ba1fe266
          python=$(command -v python3)
          mkdir "$RUNNER_TEMP/t304-build-cache"
          env -i HOME="$HOME" PATH="$PATH" TMPDIR="$RUNNER_TEMP" GOCACHE="$RUNNER_TEMP/t304-build-cache" \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            "$python" -B "$kit/hosted.py" replay --episode "$EPISODE" --contract "$kit/contract.json" --source-dir "$source" \
              --adoption "$kit/lead-adoption-141.json" --review "$kit/t311-readiness.json" \
              --archive "$input/yesman-${RELEASE_TAG#v}-darwin-arm64.tar.gz" --manifest "$input/update-darwin-arm64.json" \
              --receipt "$input/receipt.json" --scratch "$RUNNER_TEMP/t304-scratch" --evidence "$RUNNER_TEMP/t304-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t322-cleanup-only-acceptance
          path: ${{ runner.temp }}/t304-proof
          if-no-files-found: error
