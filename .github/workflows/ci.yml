name: CI

# Builds and tests yesman on every system it ships for. It runs the PR's
# code, so it has no secrets and is kept apart from the review workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CGO_CFLAGS: ${{ matrix.os == 'macos-latest' && '-O2 -g -mmacosx-version-min=13.0' || '-O2 -g' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'

      - name: Exercise native completion audio
        if: runner.os != 'macOS'
        run: |
          git show -s --format='checkout=%H tree=%T parents=%P' HEAD
          go version
          scratch=$(mktemp -d "$RUNNER_TEMP/yesman-audio.XXXXXX")
          if [ "$RUNNER_OS" = Windows ]; then
            sha256sum internal/chime/sound.go internal/chime/play_windows.go internal/chime/audio_smoke_windows_test.go
            exe="$scratch/chime.test.exe"
            go test -c -o "$exe" ./internal/chime
            sha256sum "$exe"
            YESMAN_WINMM_SMOKE=1 "$exe" -test.v -test.timeout=15s -test.run '^TestWindowsWinMMSmoke$'
          else
            sha256sum internal/chime/sound.go internal/chime/play_linux.go internal/chime/audio_smoke_linux_test.go
            ldconfig -p | grep -F libasound.so.2
            exe="$scratch/chime.test"
            go test -c -o "$exe" ./internal/chime
            sha256sum "$exe"
            for mode in capture missing-default; do
              YESMAN_ALSA_SMOKE="$mode" "$exe" -test.v -test.timeout=15s -test.run '^TestLinuxALSASmoke$'
            done
          fi

      - name: Prepare and check the managed pi runtime
        run: |
          go run ./tools/pi-runtime "$RUNNER_TEMP/yesman-pi" > "$RUNNER_TEMP/yesman-runtime.json"
          runtime=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).root)' "$RUNNER_TEMP/yesman-runtime.json")
          echo "YESMAN_TEST_RUNTIME=$runtime" >> "$GITHUB_ENV"
          YESMAN_TEST_RUNTIME="$runtime" node scripts/check-queue-runtime.mjs
          YESMAN_TEST_RUNTIME="$runtime" node scripts/check-queue-append.mjs
          YESMAN_TEST_RUNTIME="$runtime" node scripts/check-queue-preparation.mjs
          YESMAN_TEST_RUNTIME="$runtime" node scripts/check-queue-sdk.mjs
          YESMAN_TEST_RUNTIME="$runtime" node scripts/check-promote-checkpoints.mjs
          YESMAN_TEST_RUNTIME="$runtime" node scripts/check-input-identity.mjs
          YESMAN_TEST_RUNTIME="$runtime" node scripts/check-input-projection.mjs
          npm install --prefix "$RUNNER_TEMP/yesman-types" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          YESMAN_TEST_RUNTIME="$runtime" YESMAN_TEST_TSC="$RUNNER_TEMP/yesman-types/node_modules/typescript/bin/tsc" node scripts/check-queue-types.mjs

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./... && go vet -tags e2e ./...

      - name: Build
        run: go build ./... && go build -tags e2e ./...

      # The race detector needs cgo, which Windows runners lack a setup for.
      - name: Test
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go test ./...
          else
            go test -race ./...
          fi

      # Each managed write/edit and link-refusal test, by name, with its own
      # PASS or SKIP. Links must be creatable here: a test that cannot make
      # its symbolic link or (Windows) junction fails instead of skipping.
      - name: Managed write and link refusal (verbose)
        env:
          YESMAN_REQUIRE_LINK_TESTS: "1"
        run: go test -count=1 -v -run 'TestSafeFS|TestWorktreeRegistration|TestWorktreeInstance|TestWorktreeLeaseThroughConfiguredAlias|TestManagedFiles|TestManagedWriteAndEdit|TestManagedEdit|TestManagedWorktree' ./internal/safefs ./internal/pool ./internal/server

      - name: Check the published naming-pair downloader offline
        if: runner.os == 'Linux'
        run: python3 -B scripts/test_published_upgrade.py

      # Real Git conversion, process groups (Linux/macOS) and job objects (Windows).
      - name: Check the private QA producer's updater-key boundaries offline
        run: python3 -B scripts/test_upgrade_qa.py

      - name: Check the page's scripts
        run: |
          for f in web/*.js; do
            node --check "$f"
          done
          node --test scripts/*.test.mjs

  macos-startup:
    name: Production startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    # Standard GitHub-hosted images: each job gets a fresh VM/user profile.
    # Never switch this job to self-hosted; the script also refuses it.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the normal production app
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-O2 -g -mmacosx-version-min=13.0"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: go tool mygo build -skip-dmg -o "$RUNNER_TEMP/production"
      - name: Check release identity rejection against the built app
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          python3 scripts/test_macos_release_gate.py "$RUNNER_TEMP/production/darwin-$(go env GOARCH)/yesman.app" "v$version" "$(git rev-parse HEAD)" "$(go env GOARCH)" "$RUNNER_TEMP/startup-evidence/release-gate-tests.json"
      - name: Verify native window and production page bridge
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/check_macos_startup.py "$RUNNER_TEMP/production/darwin-$(go env GOARCH)/yesman.app" web "$RUNNER_TEMP/startup-evidence"
      - name: Keep startup and actual SDK evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-startup-${{ matrix.os }}
          path: ${{ runner.temp }}/startup-evidence
          if-no-files-found: error
