name: Released naming upgrade gate
on:
  workflow_dispatch:
    inputs:
      predecessor:
        description: Published predecessor (allocated naming transition only)
        default: v0.1.38
        required: true
      candidate:
        description: Immutable draft candidate
        default: v0.1.39
        required: true
      restart_qa_commit:
        description: Exact independently reviewed QA-only commit; selects the separate .49 restart jobs
        required: false
permissions:
  contents: read
jobs:
  download:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub requires push visibility for draft GET/download
    outputs:
      source: ${{ steps.inputs.outputs.source }}
    steps:
      - name: Download and authenticate public predecessor and draft inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR: ${{ inputs.predecessor }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          # BEGIN PUBLISHED NAMING DOWNLOADER
          python3 -I - "$PREDECESSOR" "$CANDIDATE" "$RUNNER_TEMP/released-inputs" <<'PY'
          import hashlib, io, json, os, pathlib, re, subprocess, sys, tarfile, urllib.parse, urllib.request


          def gh(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))


          def commit(tag):
              obj = gh('repos/idy/yesman/git/ref/tags/' + tag)['object']
              for _ in range(8):
                  if obj['type'] == 'commit':
                      assert re.fullmatch('[0-9a-f]{40}', obj['sha'])
                      return obj['sha']
                  assert obj['type'] == 'tag'
                  obj = gh('repos/idy/yesman/git/tags/' + obj['sha'])['object']
              raise AssertionError('tag cycle/depth')


          def release(tag):
              for page in range(1, 11):
                  values = gh('repos/idy/yesman/releases?per_page=100&page=' + str(page))
                  matches = [r for r in values if r['tag_name'] == tag]
                  if matches:
                      assert len(matches) == 1
                      return matches[0]
                  if len(values) < 100:
                      break
              raise AssertionError('release not visible: ' + tag)


          def main():
              oldtag, newtag, output = sys.argv[1:4]
              # Validate before any API/ref request or filesystem output.
              assert oldtag == 'v0.1.38' and newtag == 'v0.1.39', 'This gate is only the allocated naming transition'
              out = pathlib.Path(output).resolve()
              out.mkdir(parents=True, exist_ok=True)
              refs = {t: commit(t) for t in (oldtag, newtag)}
              old, new = release(oldtag), release(newtag)
              assert not old['draft'] and not old['prerelease'] and new['draft'] and not new['prerelease']
              for target in ('darwin-amd64', 'darwin-arm64', 'windows-amd64', 'windows-arm64', 'linux-amd64', 'linux-arm64'):
                  with urllib.request.urlopen('https://github.com/idy/yesman/releases/latest/download/update-' + target + '.json') as r:
                      assert json.load(r)['version'] == oldtag[1:], 'ordinary predecessor feed not propagated'
              metadata = {'kind': 'downloaded-release-and-draft', 'refs': refs, 'releases': [], 'stages': {}}
              for item, tag in ((old, oldtag), (new, newtag)):
                  folder = out / tag
                  folder.mkdir(exist_ok=True)
                  assets = {}
                  for a in item['assets']:
                      assets.setdefault(a['name'], []).append(a)

                  def download(name):
                      assert re.fullmatch('[A-Za-z0-9._-]+', name), name
                      matches = assets.get(name, [])
                      assert len(matches) == 1, name
                      asset = matches[0]
                      assert asset['size'] > 0 and re.fullmatch('sha256:[0-9a-f]{64}', asset.get('digest', ''))
                      subprocess.run(['gh', 'release', 'download', tag, '-R', 'idy/yesman', '-p', name, '-D', str(folder), '--clobber'], check=True)
                      path = folder / name
                      assert path.stat().st_size == asset['size'] and hashlib.sha256(path.read_bytes()).hexdigest() == asset['digest'][7:]
                      return path, {k: asset[k] for k in ('id', 'name', 'size', 'digest')}

                  records = []
                  for target in ('darwin-amd64', 'darwin-arm64', 'windows-amd64', 'linux-amd64'):
                      manifest, record = download('update-' + target + '.json')
                      records.append(record)
                      m = json.loads(manifest.read_text(encoding='utf-8'))
                      assert m['version'] == tag[1:]
                      artifact, record = download(urllib.parse.unquote(urllib.parse.urlparse(m['url']).path.rsplit('/', 1)[-1]))
                      records.append(record)
                      for d in m.get('deltas', []):
                          _, record = download(urllib.parse.unquote(urllib.parse.urlparse(d['url']).path.rsplit('/', 1)[-1]))
                          records.append(record)
                      name = 'yesman' if tag == oldtag else 'Yes Man'
                      entry = 'yesman.app/Contents/MacOS/' + name if target.startswith('darwin-') else name + ('.exe' if target.startswith('windows-') else '')
                      with tarfile.open(artifact) as archive:
                          binary = archive.extractfile(entry).read()
                      metadata['stages'][tag + '/' + target] = {'Version': tag[1:], 'Source': refs[tag], 'Archive': str(artifact.relative_to(out)), 'Manifest': str(manifest.relative_to(out)), 'Web': tag + '/web', 'mainName': name, 'binarySHA256': hashlib.sha256(binary).hexdigest(), 'official': True}
                  metadata['releases'].append({'tag': tag, 'id': item['id'], 'draft': item['draft'], 'assets': records})
                  # GET exact immutable source. Only copy regular web data; never execute
                  # repository code, invoke git/checkout, or extract executable source here.
                  source = subprocess.check_output(['gh', 'api', 'repos/idy/yesman/tarball/' + refs[tag]])
                  with tarfile.open(fileobj=io.BytesIO(source)) as archive:
                      members = archive.getmembers()
                      roots = {m.name.split('/')[0] for m in members}
                      assert len(roots) == 1
                      root = roots.pop()
                      cfg = json.load(archive.extractfile(root + '/mygo.json'))
                      assert cfg['version'] == tag[1:]
                      assert cfg['identifier'] == 'dev.idy.yesman' and cfg['name'] == name
                      for m in members:
                          relative = pathlib.PurePosixPath(m.name).relative_to(root)
                          assert '..' not in relative.parts and not relative.is_absolute()
                          if not relative.parts or relative.parts[0] != 'web':
                              continue
                          assert m.isdir() or m.isfile(), 'linked web source refused'
                          if m.isfile():
                              dest = folder.joinpath(*relative.parts)
                              dest.parent.mkdir(parents=True, exist_ok=True)
                              dest.write_bytes(archive.extractfile(m).read())
                      assert (folder / 'web/index.html').is_file()
                  if 'PublicKey' in metadata:
                      assert metadata['PublicKey'] == cfg['updates']['publicKey']
                  metadata['PublicKey'] = cfg['updates']['publicKey']
              assert refs == {t: commit(t) for t in refs}, 'immutable tag changed during download'
              (out / 'release-inputs.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
              if os.environ.get('GITHUB_OUTPUT'):
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write('source=' + refs[newtag] + '\n')
              print('PASS: exact public .38 + private .39 draft assets/API digests/tag sources and six ordinary predecessor manifests')


          if __name__ == '__main__':
              main()
          PY
          # END PUBLISHED NAMING DOWNLOADER
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: released-upgrade-inputs
          path: ${{ runner.temp }}/released-inputs
          if-no-files-found: error
  sign-qa:
    needs: download
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.download.outputs.source }}
          persist-credentials: false
      # The candidate above is only build input. The producer which handles the
      # updater key comes from this workflow's own reviewed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .qa-producer
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: released-upgrade-inputs
          path: ${{ runner.temp }}/released-inputs
      # Only this packaging step receives the existing updater key. The producer
      # removes it from its environment before any subprocess and gives it only
      # to the two signers (MyGo through a short-lived key file, then the
      # precompiled upgrade-assets helper), never to go/git/compilers. It builds
      # private QA successors; never executes an app or publishes a release.
      - name: Package and sign private QA successors
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .qa-producer/scripts/prepare-upgrade-qa.py "$RUNNER_TEMP/released-inputs" "$RUNNER_TEMP/gate-inputs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-upgrade-inputs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/gate-inputs/plan.json
            ${{ runner.temp }}/gate-inputs/**/*.tar.gz
            ${{ runner.temp }}/gate-inputs/**/update-*.json
            ${{ runner.temp }}/gate-inputs/*.delta
            ${{ runner.temp }}/gate-inputs/**/web
            ${{ runner.temp }}/gate-inputs/qa-build-*.log
          if-no-files-found: error
  native:
    needs: [download, sign-qa]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
    # Fresh VM per runtime; this job has neither signing key nor GH_TOKEN.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.download.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-upgrade-inputs-${{ matrix.os }}
          path: ${{ runner.temp }}/gate-inputs
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 xvfb dbus-x11 x11-utils
      - name: Run untouched released/draft upgrade and QA rollback gate
        if: runner.os != 'Linux'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/check-production-upgrade.py "$RUNNER_TEMP/gate-inputs/plan.json" "$RUNNER_TEMP/upgrade-gate-evidence"
      - name: Run Linux released/draft upgrade and QA rollback gate
        if: runner.os == 'Linux'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: xvfb-run -a dbus-run-session -- python3 scripts/check-production-upgrade.py "$RUNNER_TEMP/gate-inputs/plan.json" "$RUNNER_TEMP/upgrade-gate-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: released-upgrade-proof-${{ matrix.os }}
          path: ${{ runner.temp }}/upgrade-gate-evidence
          if-no-files-found: error

  restart-download:
    if: inputs.restart_qa_commit == github.sha && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Draft GET visibility only; downloader makes GET requests.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed QA successor before import
        run: python3 qa/restart-resume/verify.py "$GITHUB_WORKSPACE"
      - name: GET exact immutable public predecessor and draft S
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 qa/restart-resume/download.py "$RUNNER_TEMP/released-inputs"
      # Only this fixed-vocabulary status file is retained on failure. It is
      # separate from successful inputs and is never consumed by later jobs.
      - name: Retain sanitized release acquisition diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restart-download-diagnostics
          path: ${{ runner.temp }}/t199-download-diagnostics.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restart-released-inputs
          path: ${{ runner.temp }}/released-inputs
          if-no-files-found: error
  restart-public-npm:
    if: inputs.restart_qa_commit == github.sha && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - name: Verify reviewed QA successor before import
        run: python3 qa/restart-resume/verify.py "$GITHUB_WORKSPACE"
      - name: Acquire only lock-pinned public npm tarballs without scripts or credentials
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 qa/restart-resume/public_npm_cache.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/public-npm"
      - name: Retain sanitized public npm acquisition diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restart-public-npm-diagnostics
          path: ${{ runner.temp }}/t199-public-npm-diagnostics.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: restart-public-npm
          path: ${{ runner.temp }}/public-npm
          include-hidden-files: true
          if-no-files-found: error
  restart-sign-qa:
    if: inputs.restart_qa_commit == github.sha && github.run_attempt == 1
    needs: restart-download
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e2c1e68851b2a16f4ac3cd0f77baffcc0cfd7dc0
          fetch-depth: 2 # S plus its exact integration parent for metadata-only admission.
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .qa-producer
          persist-credentials: false
      - name: Verify reviewed QA successor before import
        run: python3 .qa-producer/qa/restart-resume/verify.py "$GITHUB_WORKSPACE/.qa-producer"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: restart-released-inputs
          path: ${{ runner.temp }}/released-inputs
      - name: Package and sign exactly one private Q from immutable S
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .qa-producer/scripts/prepare-upgrade-qa.py "$RUNNER_TEMP/released-inputs" "$RUNNER_TEMP/gate-inputs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: restart-signed-inputs
          path: |
            ${{ runner.temp }}/gate-inputs/plan.json
            ${{ runner.temp }}/gate-inputs/compat-plan.json
            ${{ runner.temp }}/gate-inputs/release-inputs.json
            ${{ runner.temp }}/gate-inputs/source-mapping.json
            ${{ runner.temp }}/gate-inputs/producer-validation.json
            ${{ runner.temp }}/gate-inputs/public-upgrade-verifier
            ${{ runner.temp }}/gate-inputs/**/*.tar.gz
            ${{ runner.temp }}/gate-inputs/**/update-*.json
            ${{ runner.temp }}/gate-inputs/*.delta
            ${{ runner.temp }}/gate-inputs/**/web
            ${{ runner.temp }}/gate-inputs/qa-build-*.log
          if-no-files-found: error
  restart-bind:
    if: inputs.restart_qa_commit == github.sha && github.run_attempt == 1
    needs: [restart-sign-qa, restart-public-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed QA successor before import
        run: python3 qa/restart-resume/verify.py "$GITHUB_WORKSPACE"
      - name: Validate real same-run transfers and bind package/manifest/source receipts
        env:
          GH_TOKEN: ${{ github.token }}
          QA_ARTIFACT_ID: ${{ needs.restart-sign-qa.outputs.artifact }}
          QA_ARTIFACT_DIGEST: ${{ needs.restart-sign-qa.outputs.digest }}
          NPM_ARTIFACT_ID: ${{ needs.restart-public-npm.outputs.artifact }}
          NPM_ARTIFACT_DIGEST: ${{ needs.restart-public-npm.outputs.digest }}
          APPROVED_QA_COMMIT: ${{ inputs.restart_qa_commit }}
        run: python3 qa/restart-resume/bind.py "$RUNNER_TEMP/bound-restart"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restart-bound-inputs
          path: ${{ runner.temp }}/bound-restart
          include-hidden-files: true
          if-no-files-found: error
  restart-native:
    if: inputs.restart_qa_commit == github.sha && github.run_attempt == 1
    needs: restart-bind
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: restart-bound-inputs
          path: ${{ runner.temp }}/bound-restart
      - name: Run official compatibility then serial S to Q restart acceptance
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          APPROVED_QA_COMMIT: ${{ inputs.restart_qa_commit }}
        run: python3 qa/restart-resume/run_native.py "$RUNNER_TEMP/bound-restart"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: restart-native-proof
          path: |
            ${{ runner.temp }}/restart-evidence
            ${{ runner.temp }}/t199-attachment-*
            ${{ runner.temp }}/t199-compat-*
            ${{ runner.temp }}/bound-restart/inputs/receipts
            ~/yesman
            ~/.pi/agent
          include-hidden-files: true
          if-no-files-found: warn
