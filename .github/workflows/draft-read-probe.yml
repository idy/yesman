name: Draft read access diagnostic
# Temporary, read-only F2 reproduction. Removed after evidence is archived.
on:
  pull_request:
    paths: [.github/workflows/draft-read-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    permissions:
      contents: write # Diagnose the minimum scope needed by the draft GET APIs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read an existing unpublished draft using the actual job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request, urllib.error
          repo = 'idy/yesman'
          rid, tag, aid = 444130251, 'v0.1.11', 743348931
          proof = {'run': os.environ['GITHUB_RUN_ID'], 'source': os.environ['GITHUB_SHA'], 'permission': 'contents:write', 'releaseID': rid, 'tag': tag, 'gh': subprocess.check_output(['gh','--version']).decode().splitlines()[0]}
          def get(path, auth=True):
              headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
              if auth: headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              try:
                  with urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers=headers)) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e: return e.code, None
          for key,path,auth in [('anonymousID',f'releases/{rid}',False),('authenticatedID',f'releases/{rid}',True),('byTag',f'releases/tags/{tag}',True),('list','releases?per_page=100',True),('assetMetadata',f'releases/assets/{aid}',True)]:
              status,value=get(path,auth)
              proof[key]={'http':status}
              if isinstance(value,list):proof[key]['containsDraft']=any(r['id']==rid and r['draft'] for r in value)
              elif isinstance(value,dict):proof[key].update({k:value[k] for k in ['id','tag_name','draft','published_at','name','digest'] if k in value})
          p=subprocess.run(['gh','release','view',tag,'--repo',repo,'--json','databaseId,tagName,isDraft,assets'],capture_output=True)
          proof['ghView']={'exit':p.returncode}
          if p.returncode==0:
              meta=json.loads(p.stdout);proof['ghView'].update({k:meta[k] for k in ['databaseId','tagName','isDraft']})
              asset=next(a for a in meta['assets'] if a['name']=='install.ps1')
              folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'probe-download';folder.mkdir()
              d=subprocess.run(['gh','release','download',tag,'--repo',repo,'--pattern','install.ps1','--dir',str(folder)],capture_output=True)
              proof['ghDownload']={'exit':d.returncode}
              if d.returncode==0:
                  digest=hashlib.sha256((folder/'install.ps1').read_bytes()).hexdigest()
                  proof['ghDownload'].update({'sha256':digest,'expected':asset['digest'],'bytes':(folder/'install.ps1').stat().st_size})
                  proof['passed']=asset['digest']=='sha256:'+digest and meta['isDraft'] and meta['databaseId']==rid and proof['anonymousID']['http']==404
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'draft-read-proof.json';output.write_text(json.dumps(proof,indent=2));print(output.read_text())
          assert proof.get('passed'), 'Read-only job token could not read/download the known draft'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: draft-read-proof
          path: ${{ runner.temp }}/draft-read-proof.json
          if-no-files-found: error
